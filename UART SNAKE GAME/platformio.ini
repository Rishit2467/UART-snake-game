; PlatformIO Project Configuration — STM32 Nucleo F103RB Snake Game
[env:nucleo_f103rb]
platform  = ststm32
board     = nucleo_f103rb
framework = stm32cube

; Upload and debug via ST-Link (on-board)
upload_protocol = stlink
debug_tool      = stlink

; Serial monitor on UART2 (ST-Link VCP → USB) at 115200
monitor_speed = 115200

; Extra build flags
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
    -DHSE_VALUE=8000000U
    -DHSE_STARTUP_TIMEOUT=100U
    -O2
    -Wall
    -Wextra

; Source and include paths
build_src_filter = +<src/*>
